<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f6fde">
  <title>{% block title %}finbot{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% if page %}
  <header class="top">
    <div class="top-inner">
      <div class="brand">finbot</div>
      <nav class="nav" aria-label="Telas">
        <a href="/" class="{{ 'active' if page == 'painel' }}">Painel</a>
        <a href="/extrato" class="{{ 'active' if page == 'extrato' }}">Extrato</a>
        <a href="/gastos" class="{{ 'active' if page == 'gastos' }}">Gastos</a>
        <a href="/dividas" class="{{ 'active' if page == 'dividas' }}">Dívidas</a>
        <span class="soon" title="Próxima etapa">Cartões</span>
        <span class="soon" title="Próxima etapa">Salário</span>
      </nav>
      <form class="logout" method="post" action="/sair"><button type="submit">Sair</button></form>
    </div>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
